<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rule Docs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #18191c;
      color: white;
    }

    header {
      padding: 25px;
      border-bottom: 1px solid #333;
      background: #1f2024;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #aaa;
      margin-bottom: 0;
    }

    nav {
      display: flex;
      gap: 10px;
      padding: 15px 25px;
      overflow-x: auto;
      border-bottom: 1px solid #333;
    }

    nav button {
      background: #25262a;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      white-space: nowrap;
    }

    nav button:hover {
      background: #303136;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 40px 25px;
    }

    .card {
      background: #202125;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 32px;
      margin-top: 0;
    }

    h3 {
      color: #6ea8ff;
    }

    li {
      margin: 10px 0;
      color: #ddd;
    }

    .ask {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .ask input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #151619;
      color: white;
      font-size: 16px;
    }

    .ask button {
      padding: 15px 20px;
      border: 0;
      border-radius: 12px;
      background: #3478f6;
      color: white;
      cursor: pointer;
    }

    #answer {
      color: #aaa;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<header>
  <!-- แก้ชื่อเว็บตรงนี้ -->
  <h1>📘 Rule Docs</h1>
  <p>กฎและข้อกำหนดของเซิร์ฟเวอร์</p>
</header>

<nav>
  <button onclick="showPage('home')">🏠 หน้าหลัก</button>
  <button onclick="showPage('rules')">📜 กฎ</button>
  <button onclick="showPage('penalty')">⚠️ บทลงโทษ</button>
  <button onclick="showPage('privacy')">🔐 ความเป็นส่วนตัว</button>
  <button onclick="showPage('faq')">❓ คำถาม</button>
</nav>

<main>

  <div class="ask">
    <input id="question" placeholder="Ask a question...">
    <button onclick="ask()">→</button>
  </div>

  <div id="answer"></div>

  <div id="content"></div>

</main>

<script>

const pages = {

home: `
<div class="card">
  <h2>Developer Platform</h2>
  <p>ยินดีต้อนรับสู่เอกสารของเซิร์ฟเวอร์</p>
  <p>อ่านกฎและข้อกำหนดต่าง ๆ ได้จากเมนูด้านบน</p>
</div>
`,

rules: `
<div class="card">
  <h2>📜 กฎเซิร์ฟเวอร์</h2>

  <h3>1. กฎทั่วไป</h3>
  <ul>
    <li>ให้เกียรติสมาชิกทุกคน</li>
    <li>ห้ามสแปม</li>
    <li>ห้ามก่อกวนผู้อื่น</li>
    <li>ห้ามแอบอ้างเป็นทีมงาน</li>
    <li>ห้ามส่งรูป18+</li>
    <li>ห้ามสร้างดราม่า</li>
    <li>กฎบางข้ออาจนำมาในเเชท</li>
  </ul>

  <h3>2. การโฆษณา</h3>
  <p>ห้ามโฆษณาเซิร์ฟเวอร์หรือบริการอื่นโดยไม่ได้รับอนุญาต</p>

  <h3>3. ความปลอดภัย</h3>
  <p>ห้ามเผยแพร่ข้อมูลส่วนตัวของผู้อื่นโดยไม่ได้รับอนุญาต</p>
</div>
`,

penalty: `
<div class="card">
  <h2>⚠️ บทลงโทษ</h2>

  <ul>
    <li>Warning</li>
    <li>Timeout</li>
    <li>Kick</li>
    <li>Ban</li>
  </ul>

  <p>บทลงโทษขึ้นอยู่กับความรุนแรงของการกระทำผิด</p>
</div>
`,

privacy: `
<div class="card">
  <h2>🔐 Privacy Policy</h2>

  <p>ข้อมูลของสมาชิกจะถูกใช้เท่าที่จำเป็นสำหรับการดูแลเซิร์ฟเวอร์</p>

  <h3>การใช้งานข้อมูล</h3>
  <ul>
    <li>รักษาความปลอดภัย</li>
    <li>ตรวจสอบการกระทำผิด</li>
    <li>ให้บริการระบบ</li>
  </ul>
</div>
`,

faq: `
<div class="card">
  <h2>❓ FAQ</h2>

  <h3>โฆษณาเซิร์ฟเวอร์อื่นได้ไหม?</h3>
  <p>ไม่ได้ เว้นแต่ได้รับอนุญาตจากทีมงาน</p>

  <h3>ถ้าถูกลงโทษผิดต้องทำยังไง?</h3>
  <p>ติดต่อทีมงานเพื่อขอให้ตรวจสอบ</p>

  <h3>กฎเปลี่ยนได้ไหม?</h3>
  <p>สามารถเปลี่ยนแปลงได้ตามความเหมาะสม</p>
</div>
`

};

function showPage(page) {
  document.getElementById("content").innerHTML = pages[page];
}

function ask() {

  const q = document.getElementById("question").value.toLowerCase();

  let answer = "ไม่พบข้อมูลในเอกสาร";

  if (q.includes("โฆษณา")) {
    answer = "ห้ามโฆษณาเซิร์ฟเวอร์หรือบริการอื่นโดยไม่ได้รับอนุญาต";
  }

  if (q.includes("สแปม")) {
    answer = "ห้ามสแปมหรือส่งข้อความซ้ำจนรบกวนผู้อื่น";
  }

  if (q.includes("บทลงโทษ") || q.includes("โดนอะไร")) {
    answer = "บทลงโทษอาจเป็น Warning, Timeout, Kick หรือ Ban";
  }

  document.getElementById("answer").innerText = "🤖 " + answer;
}

showPage("home");

</script>

</body>
</html>
